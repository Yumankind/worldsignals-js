<circle cx="22" cy="19" r="6" fill="#3a3d44"/><circle cx="42" cy="19" r="6" fill="#3a3d44"/><circle cx="62" cy="19" r="6" fill="#3a3d44"/>
<text x="450" y="24" text-anchor="middle" style="font-size:12.5px;fill:#8d929a">~ — worldsignals-scan</text>
<g clip-path="url(#view)"><g class="screen"><g class="scroll">
<text x="24" y="64" class="c"><tspan class="p">$</tspan> npx worldsignals-scan</text>
<text x="24" y="84" class="n r1">  reading Homebrew…</text>
<text x="24" y="104" class="n r2">  reading apps…</text>
<text x="24" y="124" class="n r3">  reading npm… pip… OSV.dev 612/612</text>
<text x="24" y="144" class="o r4"></text>
<text x="24" y="164" class="w r5">WorldSignals machine check · macOS 27.1 · 16 Nov 2026</text>
<text x="24" y="184" class="o r6">Checked 612 programs and packages against OSV.dev, CISA's exploited list, endoflife.date.</text>
<text x="24" y="204" class="n r7">Sent package names and versions to OSV.dev (Google). Nothing went to WorldSignals.</text>
<text x="24" y="224" class="o r8"></text>
<text x="24" y="244" class="w r9">3 updates fix all 52 known vulnerabilities that have a fix. One of them is urgent: being</text>
<text x="24" y="264" class="w r10">exploited right now.</text>
<text x="24" y="284" class="o r11"></text>
<text x="24" y="304" class="w r12">1. Google Chrome 157.0.8103.51 <tspan class="k">→ 157.0.8103.78</tspan> or later  <tspan class="p">[EXPLOITED NOW]</tspan></text>
<text x="24" y="324" class="o r13">   44 known vulnerabilities (3 critical, 26 high, 10 medium, 5 low).</text>
<text x="24" y="344" class="o r14">   CVE-2026-50311 is on CISA's list of exploited vulnerabilities since 12 Nov 2026.</text>
<text x="24" y="364" class="o r15">   <tspan class="s">How: Chrome menu ⋮ → Help → About Google Chrome, then Relaunch</tspan></text>
<text x="24" y="384" class="o r16"></text>
<text x="24" y="404" class="w r17">2. OpenSSL 3.6.3 <tspan class="k">→ 3.6.5</tspan> or later</text>
<text x="24" y="424" class="o r18">   6 known vulnerabilities (1 critical, 3 high, 2 medium).</text>
<text x="24" y="444" class="o r19">   <tspan class="s">How: brew upgrade openssl@3</tspan></text>
<text x="24" y="464" class="o r20"></text>
<text x="24" y="484" class="w r21">3. Python packages (pip): 2 packages to update</text>
<text x="24" y="504" class="o r22">   <tspan class="s">How: python3 -m pip install -U requests jinja2</tspan></text>
<text x="24" y="524" class="o r23"></text>
<text x="24" y="544" class="o r24">No longer supported: Python 3.9.6 (support ended 31 Oct 2025). Move to Python 3.11 or later.</text>
<g class="cov ty0"><rect x="40.86" y="49" width="899" height="20" fill="#0a0b0d"/><g class="cv0"><rect class="cur" x="40.86" y="51" width="8.43" height="17" fill="#e9e9e6" opacity=".85"/></g></g>
</g></g></g>
