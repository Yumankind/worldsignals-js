<rect x=".5" y=".5" width="899" height="445" rx="11.5" fill="none" stroke="rgb(255 255 255 / 0.08)"/>
<circle cx="22" cy="19" r="6" fill="#3a3d44"/><circle cx="42" cy="19" r="6" fill="#3a3d44"/><circle cx="62" cy="19" r="6" fill="#3a3d44"/>
<text x="450" y="24" text-anchor="middle" style="font-size:12.5px;fill:#8d929a">~/agents — worldsignals watch</text>
<g clip-path="url(#view)"><g class="screen"><g class="scroll">
<text x="24" y="64" class="c"><tspan class="p">$</tspan> npx worldsignals watch <tspan class="k">--type</tspan> company.registered,procurement.tender_published \</text>
<text x="24" y="84" class="c r1">    <tspan class="k">--country</tspan> PT,ES <tspan class="k">--agent</tspan> claude <tspan class="k">--batch</tspan></text>
<text x="24" y="104" class="o r2">No agent key on this device yet: making one, as npx worldsignals signup would.</text>
<text x="24" y="124" class="o r3">Agent agt_5c1e9a07b3d24f6e8a19c2d0 created (WorldSignals CLI); its private key is in</text>
<text x="24" y="144" class="o r4">/Users/ana/.config/worldsignals/agent.json, readable only by you.</text>
<text x="24" y="164" class="o r5">This agent isn't paid for or connected yet. Either way works:</text>
<text x="24" y="184" class="o r6">Pay for its own Developer plan (monthly; Stripe asks the payer's email, for receipts):</text>
<text x="24" y="204" class="o r7"><tspan class="s">https://checkout.stripe.com/c/pay/cs_live_b1Qx…</tspan></text>
<text x="24" y="224" class="o r8">Or connect it to your account: open <tspan class="s">https://worldsignals.dev/link</tspan> and enter <tspan class="s">HVRT-KMPW</tspan> (or open</text>
<text x="24" y="244" class="o r9"><tspan class="s">https://worldsignals.dev/link?code=HVRT-KMPW</tspan>), signed in.</text>
<text x="24" y="264" class="o r10">Waiting for the payment or the approval, then watching (Ctrl+C stops; the agent key stays saved for</text>
<text x="24" y="284" class="o r11">next time).</text>
<text x="24" y="304" class="n r12"># you approve <tspan class="s">HVRT-KMPW</tspan> at worldsignals.dev/link</text>
<text x="24" y="324" class="o r13">Connected to Oficina Exemplo, Lda: it acts for that account, with its Developer plan and its</text>
<text x="24" y="344" class="o r14">streams.</text>
<text x="24" y="364" class="w r15">Watching for new events after number 48213907 (<tspan class="k">company.registered</tspan>, <tspan class="k">procurement.tender_published</tspan>).</text>
<text x="24" y="384" class="w r16">Ctrl+C stops.</text>
<text x="24" y="404" class="n r17"># new events arrive; --batch collects them until a quiet minute</text>
<text x="24" y="424" class="e r18">  <tspan class="m">48213915</tspan>  <tspan class="k">company.registered            </tspan><tspan class="o">ES</tspan>  Robótica Imaginaria, S.L. · Valencia</text>
<text x="24" y="444" class="e r19">  <tspan class="m">48213988</tspan>  <tspan class="k">procurement.tender_published  </tspan><tspan class="o">PT</tspan>  Vila Fictícia: limpeza urbana, €480k</text>
<text x="24" y="464" class="e r20">  <tspan class="m">48214102</tspan>  <tspan class="k">company.registered            </tspan><tspan class="o">ES</tspan>  Cafés del Ejemplo, S.L. · Sevilla</text>
<text x="24" y="484" class="e r21">  <tspan class="m">48214230</tspan>  <tspan class="k">procurement.tender_published  </tspan><tspan class="o">ES</tspan>  Villa Inventada: alumbrado LED, €1.2M</text>
<text x="24" y="504" class="n r22"># a quiet minute later: claude -p starts once, with the 4 events fenced off as data</text>
<text x="24" y="524" class="r r23">4 new events in Portugal and Spain:</text>
<text x="24" y="544" class="r r24">- New companies: Robótica Imaginaria (Valencia, software) and Cafés del Ejemplo (Sevilla).</text>
<text x="24" y="564" class="r r25">- Tenders: street cleaning for Vila Fictícia (PT, €480k, closes 28 Nov) and LED street</text>
<text x="24" y="584" class="r r26">  lighting for Villa Inventada (ES, €1.2M, closes 5 Dec).</text>
<text x="24" y="604" class="r r27">Worth a look: the Vila Fictícia tender fits your cleaning-services clients; 4 weeks left.</text>
