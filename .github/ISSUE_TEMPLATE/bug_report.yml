name: Bug report
description: The worldsignals CLI did something wrong or unexpected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, don't use this form: email hello@worldsignals.dev with "Security" in the subject.
        Please leave out access keys (`wsk_…`), the contents of `~/.config/worldsignals/agent.json`, payment links and connect codes.
  - type: input
    id: version
    attributes:
      label: Version
      description: The first line of `npx worldsignals help`.
      placeholder: worldsignals 0.4.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node and operating system
      description: "`node --version`, and the OS. How you ran it: npx, a global install (`ws`), or the downloaded ws.mjs."
      placeholder: Node 22.11, macOS 15, npx
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command
      description: What you ran, with any key removed.
      render: sh
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The output or error, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Event numbers or ids involved, how often it happens, whether WS_API points elsewhere.
